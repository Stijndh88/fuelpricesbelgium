# Inputs for `python -m heating`. Replace the defaults with your own house and equipment.

[location]
# Where to take the outdoor temperature (default: Brussels).
latitude = 50.85
longitude = 4.35

[boiler]
# Share of the gas energy that ends up as heat: ~0.9 condensing boiler, ~0.8 older boiler.
efficiency = 0.9

[house]
# Gas used in a year, from the yearly bill (kWh). Sets how much heat the house needs.
annual_gas_kwh = 17000
# Part of that gas used for hot water and cooking rather than heating the rooms.
hot_water_share = 0.15
# Mean outdoor temperature below which the house needs heating, and the number of
# degree-days on that base in a normal Belgian year (approximate, Uccle).
base_temp = 16.5
degree_days = 2400

[electricity]
# Flemish digital meter: the network operator bills EUR per kW per year on the average of the
# highest 15-minute power of each month (minimum 2.5 kW). Typical value 52-61 depending on the
# operator; set 0 for a classic meter, which has no capacity tariff.
capacity_eur_per_kw_year = 55

# Outdoor units of the airco system, from their datasheets: rated heating power (kW) at +7 °C
# and at -10 °C, and SCOP. Without a cop_curve below, a generic COP curve is scaled so its
# seasonal average matches the combined SCOP.
[[heat_pump.units]]
name = "Samsung AJ040 (2x AR07)"
heating_kw = 4.2
heating_kw_at_minus10 = 2.70
scop = 4.6

[[heat_pump.units]]
name = "Samsung AJ068 (AR07, AR09, AR12)"
heating_kw = 8.0
heating_kw_at_minus10 = 5.14
scop = 4.32

# Optional: measured COP by outdoor temperature, as [temperature, COP] pairs. Overrides the
# SCOP-based estimate.
# [heat_pump]
# cop_curve = [[-15, 1.8], [-7, 2.4], [2, 3.1], [7, 3.9], [12, 4.6], [20, 5.2]]
