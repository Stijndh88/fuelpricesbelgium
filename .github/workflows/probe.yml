name: Temporary probe
on: push
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - run: |
          for p in databank evolutie; do
            curl -sS -L -m 30 -A "fuelpricesbelgium" -o /tmp/$p.html -w "$p HTTP %{http_code} %{size_download}B\n" "https://petrolfed.be/nl/maximumprijzen/$p"
            python3 - $p <<'PY'
          import re,sys,html
          raw=open(f'/tmp/{sys.argv[1]}.html',encoding='utf-8',errors='ignore').read()
          i=raw.find('<main')
          body=raw[i:] if i>=0 else raw
          print("forms/inputs/selects/buttons/links in main:")
          for m in re.finditer(r'<(form|input|select|option|button|a)\b[^>]*>',body):
              tag=m.group(0)
              if re.search(r'href="/(nl|fr|en)/(?!maximumprijzen)',tag) and '<a' in tag[:3]: continue
              print(' ',tag[:300])
          print("main text:")
          t=re.sub(r'<script.*?</script>|<style.*?</style>','',body,flags=re.S)
          t=html.unescape(re.sub(r'<[^>]+>','\n',t))
          print('\n'.join([l.strip() for l in t.splitlines() if l.strip()][:70]))
          PY
          done
