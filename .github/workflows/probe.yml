name: Temporary probe
on: push
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - run: |
          get() { curl -sS -L -m 30 -A "fuelpricesbelgium" -o "$2" -w "$1 HTTP %{http_code} %{content_type} %{size_download}B\n" "$1" || true; }
          get "https://petrolfed.be/nl/maximumprijzen" /tmp/pf.html
          echo "-- petrolfed links"; grep -o -i 'href="[^"]*"' /tmp/pf.html | grep -i -E 'xls|csv|json|download|files|prijs|evolut|histor|chart|data' | sort -u | head -40
          echo "-- petrolfed text"; python3 - <<'PY'
          import re,html
          t=open('/tmp/pf.html',encoding='utf-8',errors='ignore').read()
          t=re.sub(r'<script.*?</script>|<style.*?</style>','',t,flags=re.S)
          t=html.unescape(re.sub(r'<[^>]+>','\n',t))
          lines=[l.strip() for l in t.splitlines() if l.strip()]
          i=[n for n,l in enumerate(lines) if 'maximumprij' in l.lower()]
          print('\n'.join(lines[i[0]:i[0]+60]) if i else '\n'.join(lines[:60]))
          PY
          get "https://statbel.fgov.be/en/themes/energy/petrol-prices" /tmp/sb.html
          echo "-- statbel links"; grep -o -i 'href="[^"]*"' /tmp/sb.html | grep -i -E 'xls|csv|json|download|files|opendata|open-data|bestat|petrol|fuel|price' | sort -u | head -40
          echo "-- statbel text"; python3 - <<'PY'
          import re,html
          t=open('/tmp/sb.html',encoding='utf-8',errors='ignore').read()
          t=re.sub(r'<script.*?</script>|<style.*?</style>','',t,flags=re.S)
          t=html.unescape(re.sub(r'<[^>]+>','\n',t))
          lines=[l.strip() for l in t.splitlines() if l.strip()]
          i=[n for n,l in enumerate(lines) if 'petrol' in l.lower()]
          print('\n'.join(lines[i[0]:i[0]+60]) if i else '\n'.join(lines[:60]))
          PY
