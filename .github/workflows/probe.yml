name: Temporary source probe
on:
  push:
    branches: [claude/project-thread-c0e3qu]
    paths: [".github/workflows/probe.yml", ".github/probe_heat.py"]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e .
      - name: Heating oil max price as a daily gasoil cost (read-only, prints to the log)
        run: python .github/probe_heat.py
