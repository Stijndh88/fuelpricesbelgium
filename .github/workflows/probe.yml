name: Temporary probe
on: push
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - run: |
          B=https://petrolfed.be
          curl -sS -L -m 60 -A fb -o /tmp/all.json "$B/nl/dms_maximumprijs_export/all/2011-01-01/2026-10-07"
          python3 - <<'PY'
          import json
          d=json.load(open('/tmp/all.json'))
          for i,x in enumerate(d):
              data=x.get('data',{})
              ks=sorted(data)
              meta={k:v for k,v in x.items() if k!='data'}
              print(i,json.dumps(meta,ensure_ascii=False)[:200],len(ks),ks[0] if ks else None,ks[-1] if ks else None,data[ks[-1]] if ks else None)
          PY
