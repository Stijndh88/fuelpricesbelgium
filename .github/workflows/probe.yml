name: Temporary probe
on: push
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - run: |
          B=https://petrolfed.be
          curl -sS -L -m 30 -A fb -o /tmp/evo.js "$B/modules/custom/dms_maximumprijs_export/js/evolutie-chart.js"
          echo "== evolutie-chart.js size $(wc -c </tmp/evo.js)"
          grep -n -i -E "getData|fetch|url|ajax|\.get\(|json|api|endpoint|/nl/|/export|XMLHttp|http" /tmp/evo.js | cut -c1-300 | head -40
          echo "== getData body"
          python3 - <<'PY'
          s=open('/tmp/evo.js',encoding='utf-8',errors='ignore').read()
          i=s.find('function getData')
          print(s[i:i+2500] if i>=0 else 'no function getData')
          PY
          echo "== other module js"
          curl -sS -L -m 30 -A fb "$B/nl/maximumprijzen/databank" | grep -o '/modules/custom/dms_maximumprijs_export/js/[^"?]*' | sort -u
