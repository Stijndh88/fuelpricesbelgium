name: Temporary probe
on: push
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - run: |
          B=https://petrolfed.be
          for p in evolutie databank; do curl -sS -L -m 30 -A fb -o /tmp/$p.html "$B/nl/maximumprijzen/$p"; done
          for p in evolutie databank; do
            echo "=== $p: module scripts + inline hints"
            grep -o '/modules/custom/[^"]*\.js[^"]*' /tmp/$p.html | sort -u
            python3 - $p <<'PY'
          import re,sys
          raw=open(f'/tmp/{sys.argv[1]}.html',encoding='utf-8',errors='ignore').read()
          for m in re.finditer(r'(fetch\(|\.ajax|\$\.get|\$\.post|XMLHttpRequest|maximumprijs[^"\' ]*(json|csv|xls|export|data)|/export|/api/|\.csv|\.xls)',raw,flags=re.I):
              s=max(0,m.start()-150); print('..',raw[s:m.end()+250].replace('\n',' '))
          PY
          done
          for js in $(grep -o '/modules/custom/dms_maximumprijs_export/js/[^"?]*' /tmp/evolutie.html /tmp/databank.html | cut -d: -f2 | sort -u | grep -v echarts); do
            echo "=== $js"; curl -sS -L -m 30 -A fb "$B$js" | head -c 6000
          done
