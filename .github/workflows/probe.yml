name: Temporary probe
on: push
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - run: |
          curl -sS -L -m 30 -A "fuelpricesbelgium" -o /tmp/pf.html "https://petrolfed.be/nl/maximumprijzen"
          python3 - <<'PY'
          import re,html
          raw=open('/tmp/pf.html',encoding='utf-8',errors='ignore').read()
          print("len",len(raw))
          print("-- script srcs"); print('\n'.join(sorted(set(re.findall(r'<script[^>]+src="([^"]+)"',raw)))[:30]))
          print("-- drupalSettings / data attrs")
          for m in re.finditer(r'(drupalSettings|data-chart|data-series|data-url|data-src|data-json|csv|xlsx|\.json)',raw):
              s=max(0,m.start()-80); print(raw[s:m.end()+200].replace('\n',' ')); print('..')
              if m.start()>len(raw): break
          PY
          echo "-- Databank/Evolutie html"
          python3 - <<'PY'
          import re
          raw=open('/tmp/pf.html',encoding='utf-8',errors='ignore').read()
          for key in ['Databank','Evolutie']:
              for m in list(re.finditer(key,raw))[:4]:
                  print(key,'@',m.start(),raw[max(0,m.start()-300):m.start()+700].replace('\n',' ')); print('=====')
          PY
