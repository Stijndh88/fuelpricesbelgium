name: Heating advice

# Each morning in the heating season, compares heating with gas and with the heat pump for
# the coming week and writes the result to the run's summary page. Commits nothing.
on:
  workflow_dispatch:
  schedule:
    - cron: "0 5 * 10-12,1-4 *"

jobs:
  advice:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e .
      - run: python -m heating | tee -a "$GITHUB_STEP_SUMMARY"
