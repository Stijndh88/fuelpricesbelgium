name: Daily price update

# Fetches the official maximum prices and the Brent crude price, merges them into
# data/prices.sqlite, writes the refuel advice to data/advice.json and commits the file when anything changed. Safe to run more than once
# a day: a run without new prices leaves the file untouched.
on:
  workflow_dispatch:
    inputs:
      notify_test:
        description: "Send the notification even when the advice did not change"
        type: boolean
        default: false
      only_if_missing:
        description: "Skip unless it is 08:00 Belgian time or later and today's advice is missing or incomplete (for an external scheduler)"
        type: boolean
        default: false
  schedule:
    # From 08:00 Belgian time, as soon as the official prices for tomorrow are out (petrolfed had
    # them before 09:46 on 16 Oct; the 10:00 start of the first version made the advice lag the
    # newsletter). GitHub cron is UTC only and often hours late (or skipped), and Belgium switches
    # between UTC+2 and UTC+1, so entries fire every half hour from 06:00 UTC and the gate job
    # lets a run through while the advice is not from today's Brussels date, or while it still
    # lacks tomorrow's published price (until 18:00). Extra entries cost nothing: the gate skips
    # them. Off-peak minutes, because the top of the hour is the busiest.
    - cron: "17,47 6-20 * * *"

permissions:
  contents: write

concurrency:
  group: daily-price-update
  cancel-in-progress: false

jobs:
  gate:
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.hour.outputs.run }}
    steps:
      - uses: actions/checkout@v4
      - id: hour
        env:
          ONLY_IF_MISSING: ${{ inputs.only_if_missing }}
        run: |
          hour="$(TZ=Europe/Brussels date +%H)"
          today="$(TZ=Europe/Brussels date +%F)"
          done_for="$(jq -r '.as_of // empty' data/advice.json 2>/dev/null || true)"
          echo "Brussels: $today $hour h, advice is from: ${done_for:-none} (event: $GITHUB_EVENT_NAME)"
          guarded="$GITHUB_EVENT_NAME"
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ] && [ "${ONLY_IF_MISSING:-false}" = true ]; then guarded=schedule; fi
          waiting="$(jq -r '[.advice[] | select(.price_tomorrow == null)] | length' data/advice.json 2>/dev/null || echo 1)"
          h=$((10#$hour))
          if [ "$guarded" != schedule ] || { [ "$h" -ge 8 ] && { [ "$done_for" != "$today" ] || { [ "$waiting" -gt 0 ] && [ "$h" -lt 18 ]; }; }; }; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

  update:
    needs: gate
    if: needs.gate.outputs.run == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e .
      - name: Download the FOD Economie price page
        run: curl -sSfL -A "fuelpricesbelgium" -o page.html "$(python -c 'from fuelprices.sources import fod; print(fod.URL)')"
      - name: Update the price history
        run: python -m fuelprices.update --db data/prices.sqlite --html page.html
      - name: Backfill years of history when the file is new or short
        run: |
          if [ "$(sqlite3 data/prices.sqlite 'select count(*) from daily_prices where heating_oil_max is not null')" -lt 1000 ]; then
            python -m fuelprices.backfill --db data/prices.sqlite --since 2019-01-01
          fi
      - name: Fit the price rules to the history
        run: fuelprices calibrate --db data/prices.sqlite --json data/calibration.json
      - name: Keep the previous advice for the notification
        run: if [ -f data/advice.json ]; then cp data/advice.json "$RUNNER_TEMP/advice-previous.json"; fi
      - name: Write the refuel advice
        run: fuelprices advise --db data/prices.sqlite --json data/advice.json
      - name: Commit the price history
        run: |
          if git diff --quiet -- data/prices.sqlite && [ -z "$(git status --porcelain -- data/advice.json data/calibration.json)" ]; then
            echo "No new prices."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/prices.sqlite data/advice.json data/calibration.json
          git commit -m "Update price history ($(date -u +%F))"
          # main may have moved while the job ran; replay this commit on top before pushing.
          git pull --rebase origin main
          git push
      # Needs the repository secret NTFY_TOPIC (a long random name); skipped quietly without it.
      # Sends only when the advice changed; set the variable NTFY_DAILY to 1 for a daily summary.
      - name: Notify subscribers
        continue-on-error: true
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          NTFY_DAILY: ${{ inputs.notify_test && '1' || vars.NTFY_DAILY }}
          NTFY_LANGUAGES: ${{ vars.NTFY_LANGUAGES }}
        run: python -m fuelprices.notify --previous "$RUNNER_TEMP/advice-previous.json"
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: fod-page
          path: page.html
